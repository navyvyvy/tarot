<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c0a4e"/>
      <stop offset="100%" stop-color="#06021a"/>
    </linearGradient>
    <radialGradient id="mg" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#f6ecb4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#e8d07a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c8a448" stop-opacity="0.3"/>
    </radialGradient>
    <mask id="m">
      <circle cx="96" cy="96" r="58" fill="white"/>
      <circle cx="122" cy="80" r="46" fill="black"/>
    </mask>
  </defs>
  <!-- 배경 -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- 배경 패턴 점 -->
  <circle cx="32"  cy="32"  r="1.2" fill="#c8a448" fill-opacity="0.3"/>
  <circle cx="160" cy="32"  r="1.2" fill="#c8a448" fill-opacity="0.3"/>
  <circle cx="32"  cy="160" r="1.2" fill="#c8a448" fill-opacity="0.3"/>
  <circle cx="160" cy="160" r="1.2" fill="#c8a448" fill-opacity="0.3"/>
  <!-- 달 글로우 -->
  <circle cx="96" cy="96" r="66" fill="#c8a448" fill-opacity="0.05"/>
  <!-- 초승달 -->
  <circle cx="96" cy="96" r="58" fill="url(#mg)" mask="url(#m)"/>
  <circle cx="96" cy="96" r="58" fill="none" stroke="#e8d07a" stroke-width="1.5" stroke-opacity="0.7" mask="url(#m)"/>
  <!-- 별 장식 -->
  <circle cx="46"  cy="52"  r="2.5" fill="#e8d07a" fill-opacity="0.8"/>
  <circle cx="152" cy="46"  r="1.8" fill="#e8d07a" fill-opacity="0.7"/>
  <circle cx="38"  cy="138" r="1.5" fill="#e8d07a" fill-opacity="0.6"/>
  <circle cx="158" cy="148" r="2"   fill="#e8d07a" fill-opacity="0.7"/>
  <!-- 별 십자 스파클 -->
  <g stroke="#e8d07a" stroke-opacity="0.65" stroke-width="1.2" stroke-linecap="round">
    <line x1="46" y1="47" x2="46" y2="57"/>
    <line x1="41" y1="52" x2="51" y2="52"/>
  </g>
</svg>
