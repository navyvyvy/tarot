<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1c0a4e"/>
      <stop offset="50%" stop-color="#100538"/>
      <stop offset="100%" stop-color="#06021a"/>
    </linearGradient>
    <pattern id="dp" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="1.2" fill="#c8a448" fill-opacity="0.15"/>
    </pattern>
    <radialGradient id="mg" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#f6ecb4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#e8d07a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c8a448" stop-opacity="0.25"/>
    </radialGradient>
    <mask id="m">
      <circle cx="256" cy="240" r="148" fill="white"/>
      <circle cx="322" cy="196" r="118" fill="black"/>
    </mask>
  </defs>
  <!-- 배경 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#dp)"/>
  <!-- 테두리 -->
  <rect x="18" y="18" width="476" height="476" rx="80" fill="none" stroke="#c8a448" stroke-width="2" stroke-opacity="0.3"/>
  <!-- 달 글로우 링 -->
  <circle cx="256" cy="240" r="168" fill="none" stroke="#c8a448" stroke-width="0.8" stroke-opacity="0.1"/>
  <circle cx="256" cy="240" r="158" fill="#c8a448" fill-opacity="0.04" mask="url(#m)"/>
  <!-- 초승달 -->
  <circle cx="256" cy="240" r="148" fill="url(#mg)" mask="url(#m)"/>
  <circle cx="256" cy="240" r="148" fill="none" stroke="#e8d07a" stroke-width="2.5" stroke-opacity="0.65" mask="url(#m)"/>
  <!-- 별 장식 -->
  <circle cx="112" cy="132" r="5"   fill="#e8d07a" fill-opacity="0.75"/>
  <circle cx="402" cy="112" r="3.5" fill="#e8d07a" fill-opacity="0.65"/>
  <circle cx="94"  cy="360" r="3"   fill="#e8d07a" fill-opacity="0.55"/>
  <circle cx="418" cy="378" r="4.5" fill="#e8d07a" fill-opacity="0.7"/>
  <circle cx="148" cy="90"  r="2.5" fill="#e8d07a" fill-opacity="0.5"/>
  <circle cx="368" cy="388" r="2.5" fill="#e8d07a" fill-opacity="0.5"/>
  <!-- 별 십자 스파클 큰 것 -->
  <g stroke="#e8d07a" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round">
    <line x1="112" y1="122" x2="112" y2="142"/>
    <line x1="102" y1="132" x2="122" y2="132"/>
  </g>
  <!-- 별 십자 스파클 작은 것 -->
  <g stroke="#e8d07a" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round">
    <line x1="418" y1="370" x2="418" y2="386"/>
    <line x1="410" y1="378" x2="426" y2="378"/>
  </g>
</svg>
